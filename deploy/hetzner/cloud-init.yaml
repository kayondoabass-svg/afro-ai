#cloud-config
# =============================================================================
# Cloud-init for a fresh Hetzner Cloud server (Ubuntu 24.04 LTS).
#
# Paste this into Hetzner Cloud → Create Server → "Cloud config" or pass it
# via the `--user-data` flag of `hcloud server create`. On first boot it:
#   1. Hardens SSH (no root password, key-only) and locks down the firewall
#   2. Creates an `afro` user that owns the app
#   3. Installs Node.js 20 (NodeSource), PostgreSQL 16, Caddy, ufw, fail2ban
#   4. Creates the `afroai` Postgres database + user (random password in
#      /root/db_password.txt — read it once and remove it)
#   5. Lays out /srv/afro-ai for the app code (deploy.sh rsyncs into it)
#
# After boot:
#   ssh afro@<server-ip>
#   cat /root/db_password.txt   # copy DB password into /srv/afro-ai/.env
#   bash deploy/hetzner/migrate-db.sh    # from your laptop, copies Replit data
#   sudo systemctl start afro-ai
# =============================================================================

users:
  - name: afro
    groups: sudo
    shell: /bin/bash
    sudo: ['ALL=(ALL) NOPASSWD:ALL']
    ssh_authorized_keys:
      # REPLACE this with `cat ~/.ssh/id_ed25519.pub` from your laptop.
      - ssh-ed25519 AAAA_REPLACE_ME_WITH_YOUR_PUBLIC_KEY user@laptop

ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates
  - gnupg
  - ufw
  - fail2ban
  - postgresql
  - postgresql-contrib
  - rsync
  - git
  - debian-keyring
  - debian-archive-keyring
  - apt-transport-https

write_files:
  - path: /etc/ssh/sshd_config.d/99-afro.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      X11Forwarding no
      MaxAuthTries 3

  - path: /etc/sysctl.d/99-afro.conf
    content: |
      net.ipv4.tcp_syncookies = 1
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.icmp_echo_ignore_broadcasts = 1

  - path: /root/post-install.sh
    permissions: '0700'
    content: |
      #!/bin/bash
      set -euo pipefail

      # Node 20 from NodeSource
      curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      apt-get install -y nodejs

      # Caddy (auto-HTTPS reverse proxy)
      curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
        | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
      curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
        | tee /etc/apt/sources.list.d/caddy-stable.list
      apt-get update
      apt-get install -y caddy

      # Postgres role + DB
      DB_PASS=$(openssl rand -base64 24 | tr -d '/+=' | head -c 32)
      sudo -u postgres psql -v ON_ERROR_STOP=1 <<SQL
      CREATE ROLE afroai WITH LOGIN PASSWORD '$DB_PASS';
      CREATE DATABASE afroai OWNER afroai;
      GRANT ALL PRIVILEGES ON DATABASE afroai TO afroai;
      SQL
      echo "DATABASE_URL=postgres://afroai:$DB_PASS@127.0.0.1:5432/afroai" > /root/db_password.txt
      chmod 600 /root/db_password.txt

      # App layout
      mkdir -p /srv/afro-ai/{releases,shared,logs}
      chown -R afro:afro /srv/afro-ai

      # Firewall: only SSH + HTTP + HTTPS
      ufw default deny incoming
      ufw default allow outgoing
      ufw allow 22/tcp
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw --force enable

      systemctl enable --now fail2ban
      systemctl restart ssh

      echo "post-install complete. Read /root/db_password.txt then remove it."

runcmd:
  - bash /root/post-install.sh 2>&1 | tee /root/post-install.log
