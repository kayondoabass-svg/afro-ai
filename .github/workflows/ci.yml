name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean install (no cache reuse)
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile

      - name: Diagnose vite
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          echo "--- node_modules/vite contents ---"
          ls -la node_modules/vite 2>&1 | head -20
          echo "--- vite package.json (version / main / exports) ---"
          node -e "const v=require('./node_modules/vite/package.json');console.log('version:',v.version,'| main:',v.main,'| has exports:',!!v.exports)" || echo ">>> VITE package.json BROKEN OR MISSING <<<"
          echo "--- can Node actually import vite? ---"
          node --input-type=module -e "import('vite').then(()=>console.log('ESM import vite: OK')).catch(e=>console.log('ESM import vite FAILED:',e.code,e.message))"

      - name: Typecheck (non-blocking)
        run: pnpm exec tsc -p tsconfig.legacy.json
        continue-on-error: true

      - name: Test
        run: pnpm exec vitest run --maxWorkers=2

      - name: Build
        run: pnpm exec tsx script/build.ts
