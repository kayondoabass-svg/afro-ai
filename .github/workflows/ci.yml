name: CI

# Runs on every push to main and on every pull request.
# - `verify` catches type errors, failing tests, and build breaks BEFORE
#   they reach the production droplet.
# - `deploy` runs scripts/deploy.sh on the droplet, but ONLY after `verify`
#   passes and ONLY on a push to main (never on pull requests).
#
# Required GitHub repository secrets for the deploy job (Settings → Secrets
# and variables → Actions):
#   DROPLET_HOST     - droplet IP or hostname (e.g. 165.232.64.81)
#   DROPLET_USER     - SSH user that may run deploy.sh (e.g. root)
#   DROPLET_SSH_KEY  - the PRIVATE SSH key (PEM) whose public key is in the
#                      droplet's authorized_keys
#   DROPLET_SSH_PORT - (optional) SSH port; defaults to 22 if unset
#
# If the deploy secrets are not set, the deploy job is skipped automatically
# so CI still works as plain checks.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Typecheck is currently informational: the project builds via esbuild
      # (no type-checking) and has a backlog of pre-existing tsc errors. Keep
      # this non-blocking so it surfaces the count without failing CI, until
      # the baseline is cleaned up.
      - name: Typecheck (non-blocking)
        run: npx tsc
        continue-on-error: true

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx tsx script/build.ts

  deploy:
    name: Deploy to droplet
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Guard - require deploy secrets
        id: guard
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$DROPLET_HOST" ]; then
            echo "DROPLET_HOST secret not set - skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH deploy (runs scripts/deploy.sh on the droplet)
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          command_timeout: 20m
          script: bash /opt/afro-ai/scripts/deploy.sh
