name: CI

# Runs tests + build on every push to main and every pull request.
# Deployment is done manually on the droplet via:
#   bash /opt/afro-ai/scripts/deploy.sh

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --include=dev forces dev tools (vitest, tsx, vite, tsc) to install.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck (non-blocking)
        run: npx tsc
        continue-on-error: true

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx tsx script/build.ts
