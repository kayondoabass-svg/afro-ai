name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Force dev-dependencies (vitest, tsx, vite, tsc) to install on the
      # runner. Without --include=dev they were being skipped, causing
      # "vitest: not found" (exit 127) in the Test step.
      - name: Install dependencies
        run: npm ci --include=dev

      - name: Typecheck (non-blocking)
        run: npx tsc
        continue-on-error: true

      - name: Test
        run: npx vitest run

      - name: Build
        run: npx tsx script/build.ts

  deploy:
    name: Deploy to droplet
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Guard - require deploy secrets
        id: guard
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
        run: |
          if [ -z "$DROPLET_HOST" ]; then
            echo "DROPLET_HOST secret not set - skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: SSH deploy (runs scripts/deploy.sh on the droplet)
        if: steps.guard.outputs.ready == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT || 22 }}
          command_timeout: 20m
          script: bash /opt/afro-ai/scripts/deploy.sh
