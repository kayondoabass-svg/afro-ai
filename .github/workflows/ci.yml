name: CI

# Tests + build on every push to main and every PR.
# Deployment is manual on the droplet: bash /opt/afro-ai/scripts/deploy.sh

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Diagnose install
        run: |
          echo "node $(node -v) / npm $(npm -v) / NODE_ENV=$NODE_ENV"
          echo "omit=$(npm config get omit) production=$(npm config get production)"
          ls -la node_modules/vitest/vitest.mjs || echo "MISSING vitest package"
          ls -la node_modules/.bin/vitest || echo "MISSING .bin/vitest symlink"

      - name: Typecheck (non-blocking)
        run: node node_modules/typescript/bin/tsc
        continue-on-error: true

      - name: Test
        run: node node_modules/vitest/vitest.mjs run

      - name: Build
        run: node node_modules/tsx/dist/cli.mjs script/build.ts
