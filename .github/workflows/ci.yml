name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev

      - name: Diagnose install
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          node -e "console.log('vite   ->', require('vite/package.json').version)" || echo "MISSING vite"
          node -e "console.log('vitest ->', require('vitest/package.json').version)" || echo "MISSING vitest"

      - name: Typecheck (non-blocking)
        run: node node_modules/typescript/bin/tsc
        continue-on-error: true

      - name: Test
        run: node node_modules/vitest/vitest.mjs run

      - name: Build
        run: node node_modules/tsx/dist/cli.mjs script/build.ts
